
name: Update Stock Data - 57 Ticker 5Y Anti 429 FIX

on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: update-data-bank
  cancel-in-progress: false

jobs:
  update-json:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch Data from Yahoo Finance (57 Ticker 5Y - Cookie Crumb + Anti 429)
        run: |
          node -e "
          const fs = require('fs');
          // 57 TICKER URUTAN ASLI - JANGAN DIROMBAK Bro
          const tickers = [           'AGRO','AGRS','AMAR','ARTO','BABP','BACA','BANK','BBCA','BBHI','BBKP','BBMD','BBNI','BBRI','BBSI','BBTN','BBYB','BCIC','BDMN','BGTG','BINA','BJBR','BJTM','BKSW','BMAS','BMRI','BNBA','BNGA','BNII','BNLI','BRIS','BSIM','BSWD','BTPN','BTPS','BVIC','DNAR','INPC','MASB','MAYA','MCOR','MEGA','NISP','NOBU','PNBN','PNBS','SDRA','SUPA',
            'ASII','TLKM','GOTO','UNTR','^JKSE','SMGR','KLBF','ICBP','ANTM','EXCL'
          ];

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          const jitter = (base) => base + Math.floor(Math.random()*800);

          function getYahooTicker(ticker) {
            if (ticker === '^JKSE' || ticker === 'JKSE' || ticker === 'IHSG' || ticker === 'COMPOSITE') {
              return '%5EJKSE';
            }
            return ticker + '.JK';
          }

          async function getYahooSession() {
            let cookie = '';
            let crumb = '';
            try {
              console.log('🍪 Ambil Yahoo cookie...');
              const r = await fetch('https://fc.yahoo.com', {
                headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36' },
                redirect: 'manual'
              });
              const setCookie = r.headers.get('set-cookie') || '';
              const match = setCookie.match(/A3=[^;]+/);
              cookie = match ? match[0] : setCookie.split(';')[0];
              if (cookie) {
                console.log('🍪 Cookie OK:', cookie.slice(0,35)+'...');
                const crumbRes = await fetch('https://query1.finance.yahoo.com/v1/test/getcrumb', {
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36',
                    'Cookie': cookie,
                    'Accept': '*/*'
                  }
                });
                if (crumbRes.ok) {
                  crumb = (await crumbRes.text()).trim();
                  console.log('🔑 Crumb OK:', crumb.slice(0,30));
                } else {
                  console.log('⚠️ Crumb fetch HTTP', crumbRes.status);
                }
              }
            } catch (e) {
              console.log('⚠️ Gagal session:', e.message);
            }
            return { cookie, crumb };
          }

          async function fetchWithRetry(ticker, session, retries = 5) {
            const yahooTicker = getYahooTicker(ticker);
            let urlBase = 'https://query1.finance.yahoo.com/v8/finance/chart/' + yahooTicker + '?range=5y&interval=1d';
            if (session.crumb) urlBase += '&crumb=' + encodeURIComponent(session.crumb);

            for (let attempt = 1; attempt <= retries; attempt++) {
              try {
                const url = urlBase + '&_=' + Date.now() + attempt;
                console.log('📡 ['+attempt+'/'+retries+'] '+ticker+' -> '+yahooTicker);

                const headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36',
                  'Accept': 'application/json, text/plain, */*',
                  'Accept-Language': 'en-US,en;q=0.9',
                  'Referer': 'https://finance.yahoo.com/quote/'+yahooTicker+'/',
                  'Origin': 'https://finance.yahoo.com'
                };
                if (session.cookie) headers['Cookie'] = session.cookie;

                const res = await fetch(url, { headers });

                if (res.status === 429) {
                  const wait = 12000 * attempt + jitter(2000);
                  console.log('⏳ 429 Rate limit '+ticker+' attempt '+attempt+', tidur '+(wait/1000)+'s');
                  await sleep(wait);
                  if (attempt===3) {
                    console.log('🔄 Refresh session di attempt 3...');
                    const ns = await getYahooSession();
                    if (ns.cookie) session.cookie = ns.cookie;
                    if (ns.crumb) session.crumb = ns.crumb;
                  }
                  continue;
                }
                if (res.status === 401 || res.status === 403) {
                  console.log('🔒 '+res.status+' auth fail '+ticker+', refresh...');
                  const ns = await getYahooSession();
                  if (ns.cookie) session.cookie = ns.cookie;
                  if (ns.crumb) session.crumb = ns.crumb;
                  await sleep(jitter(3000));
                  continue;
                }
                if (!res.ok) throw new Error('HTTP '+res.status);

                const text = await res.text();
                let json;
                try { json = JSON.parse(text); } catch(e) {
                  throw new Error('Bukan JSON, mungkin HTML block: '+text.slice(0,200));
                }
                if (json.chart?.error) throw new Error('Yahoo error: '+JSON.stringify(json.chart.error));
                const result = json.chart?.result?.[0];
                if (!result?.timestamp) throw new Error('timestamp kosong');

                return result;
              } catch (err) {
                console.log('⚠️ '+ticker+' attempt '+attempt+' gagal: '+err.message);
                if (attempt===retries) return null;
                await sleep(jitter(1500*attempt));
              }
            }
            return null;
          }

          (async () => {
            const session = await getYahooSession();
            let masterData = {};
            let allDates = new Set();
            console.log('🚀 Mulai 57 saham 5Y - urutan ASLI fixed');

            for (let idx=0; idx<tickers.length; idx++) {
              const ticker = tickers[idx];
              const result = await fetchWithRetry(ticker, session);
              if (!result) {
                console.log('❌ '+ticker+' final gagal - skip');
                continue;
              }
              const timestamps = result.timestamp || [];
              const closes = result.indicators?.quote?.[0]?.close || [];
              let validCount=0;
              for (let i=0;i<timestamps.length;i++) {
                if (closes[i]==null) continue;
                const dateStr = new Date(timestamps[i]*1000).toISOString().slice(0,10);
                allDates.add(dateStr);
                if (!masterData[dateStr]) masterData[dateStr]={};
                masterData[dateStr][ticker]=Math.round(closes[i]);
                validCount++;
              }
              console.log('✅ '+ticker+' sukses ('+validCount+')');

              await sleep(jitter(1400));
              if ((idx+1)%8===0) {
                console.log('😴 Istirahat 6 detik setelah '+(idx+1)+' ticker...');
                await sleep(6000);
              }
            }

            let sortedDates = Array.from(allDates).sort();
            console.log('📅 Total tanggal unik:', sortedDates.length, 'Range:', sortedDates[0], '->', sortedDates[sortedDates.length-1]);

            let lastPrices={};
            tickers.forEach(t=>lastPrices[t]=null);
            let finalHistory=[];

            for (const dateStr of sortedDates) {
              let prices={};
              for (const ticker of tickers) {
                if (masterData[dateStr]?.[ticker]!=null) {
                  prices[ticker]=masterData[dateStr][ticker];
                  lastPrices[ticker]=prices[ticker];
                } else {
                  prices[ticker]=lastPrices[ticker]!=null ? lastPrices[ticker] : null;
                }
              }
              if (Object.values(prices).some(v=>v!=null)) {
                for (const t of tickers) {
                  if (prices[t]==null) prices[t]=lastPrices[t]!=null ? lastPrices[t] : 0;
                }
                finalHistory.push({ dateStr, prices });
              }
            }

            console.log('📊 Sample 5 hari terakhir:');
            finalHistory.slice(-5).forEach(d=> console.log(d.dateStr, 'JKSE:', d.prices['^JKSE'], 'BBCA:', d.prices['BBCA']));

            const jkseSample = finalHistory.slice(-5).map(d=>d.prices['^JKSE']);
            console.log('Sample JKSE 5 hari terakhir:', jkseSample);
            if (jkseSample.every(v=>v===0||v==null)) {
              console.error('❌ FATAL: JKSE 0 semua');
              process.exit(1);
            }

            if (finalHistory.length===0) {
              console.error('Gagal total history kosong');
              process.exit(1);
            }

            const today = new Date();
            const lastDateStr = finalHistory[finalHistory.length-1]?.dateStr;
            const lastDate = new Date(lastDateStr);
            const diffDays = Math.floor((today-lastDate)/86400000);
            console.log('⏰ Hari ini:', today.toISOString().slice(0,10), '| Data terakhir:', lastDateStr, '| Selisih:', diffDays, 'hari');
            if (diffDays>5) console.warn('⚠️ Data terakhir >5 hari, mungkin libur atau Yahoo delay');

            const output={
              tickers,
              history: finalHistory,
              last_updated: new Date().toISOString(),
              last_updated_wib: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }),
              total_days: finalHistory.length,
              source: 'Yahoo Finance - BEI - 57 Ticker 5Y Anti 429 Same Order'
            };

            fs.writeFileSync('data.json', JSON.stringify(output, null, 2));
            console.log('🎉 data.json berhasil: '+finalHistory.length+' hari, '+tickers.length+' ticker - URUTAN TETAP');
            console.log('📁 Size:', (fs.statSync('data.json').size/1024).toFixed(1), 'KB');
          })();
          "

      - name: Validate data.json
        run: |
          ls -lh data.json
          node -e "
          const d=require('./data.json'); 
          console.log('Tickers:', d.tickers.length, '| Days:', d.history.length, '| Last:', d.last_updated_wib);
          console.log('Order check first 5:', d.tickers.slice(0,5), '| last 5:', d.tickers.slice(-5));
          const last = d.history[d.history.length-1];
          console.log('Last date:', last.dateStr, '| Sample JKSE/BBCA/GOTO:', last.prices['^JKSE'], last.prices['BBCA'], last.prices['GOTO']);
          if(!last.prices['^JKSE'] || last.prices['^JKSE'] < 1000) throw new Error('JKSE invalid: ' + last.prices['^JKSE']);
          if(d.history.length < 100) throw new Error('Data too short: ' + d.history.length);
          if(d.tickers.length !== 57) throw new Error('Ticker count harus 57, dapet ' + d.tickers.length);
          if(d.tickers[0] !== 'AGRO') throw new Error('Urutan berubah! Harus AGRO di awal');
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix: Update data 57 ticker 5Y Anti-429 Same Order $(date +'%Y-%m-%d %H:%M WIB')"
            git push
          fi
